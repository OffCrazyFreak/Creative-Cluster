name: Keep scheduled workflows alive

# GitHub disables schedules after 60 days without repository activity. Re-enabling through the
# API is the approach keepalive-workflow uses; a failure must show, so errors are not swallowed.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in deploy.yml backup.yml keepalive.yml; do
            gh workflow enable "$workflow"
          done
