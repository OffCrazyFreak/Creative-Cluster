name: Migrate

# Migrations are additive (expand first, contract later), so they can run before the next deploy.
on:
  push:
    branches: [main]
    paths: [drizzle/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        site: [rpcc, dnz]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply migrations
        env:
          URL_RPCC: ${{ secrets.DATABASE_URL_UNPOOLED_RPCC }}
          URL_DNZ: ${{ secrets.DATABASE_URL_UNPOOLED_DNZ }}
        run: |
          export DATABASE_URL_UNPOOLED="$([ "${{ matrix.site }}" = rpcc ] && echo "$URL_RPCC" || echo "$URL_DNZ")"
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then echo "No database secret for ${{ matrix.site }} yet."; exit 0; fi
          pnpm db:migrate
