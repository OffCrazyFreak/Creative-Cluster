name: Migrate

# Migrations are additive (expand first, contract later), so they can run before the next deploy.
# They run only after CI passed on the same main commit; with nothing new, migrate is a no-op.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        site: [rpcc, dnz]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply migrations
        env:
          PRODUCTION_READY: ${{ vars.PRODUCTION_READY }}
          URL_RPCC: ${{ secrets.DATABASE_URL_UNPOOLED_RPCC }}
          URL_DNZ: ${{ secrets.DATABASE_URL_UNPOOLED_DNZ }}
        run: |
          export DATABASE_URL_UNPOOLED="$([ "${{ matrix.site }}" = rpcc ] && echo "$URL_RPCC" || echo "$URL_DNZ")"
          # Until the accounts exist (repository variable PRODUCTION_READY unset) a missing secret is a skip; after that it fails.
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            if [ "$PRODUCTION_READY" = "true" ]; then echo "Missing database secret for ${{ matrix.site }}."; exit 1; fi
            echo "No database secret for ${{ matrix.site }} yet."; exit 0
          fi
          pnpm db:migrate
