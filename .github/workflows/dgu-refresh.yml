name: DGU address refresh

# DGU regenerates the open address dataset weekly; a monthly import is enough for a directory.
on:
  schedule:
    - cron: "15 3 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        site: [rpcc, dnz]
    steps:
      - name: Check the database secret
        id: gate
        env:
          URL_RPCC: ${{ secrets.DATABASE_URL_UNPOOLED_RPCC }}
          URL_DNZ: ${{ secrets.DATABASE_URL_UNPOOLED_DNZ }}
        run: |
          url="$([ "${{ matrix.site }}" = rpcc ] && echo "$URL_RPCC" || echo "$URL_DNZ")"
          if [ -z "$url" ]; then echo "No database secret for ${{ matrix.site }} yet, skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.gate.outputs.run == 'true'
      - name: Download, parse and swap in the addresses
        if: steps.gate.outputs.run == 'true'
        env:
          URL_RPCC: ${{ secrets.DATABASE_URL_UNPOOLED_RPCC }}
          URL_DNZ: ${{ secrets.DATABASE_URL_UNPOOLED_DNZ }}
        run: |
          export DATABASE_URL="$([ "${{ matrix.site }}" = rpcc ] && echo "$URL_RPCC" || echo "$URL_DNZ")"
          pnpm dgu:import
