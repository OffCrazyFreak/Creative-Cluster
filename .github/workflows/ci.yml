name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc
          POSTGRES_DB: cc_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cc:cc@localhost:5432/cc_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cp .env.ci .env.local
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:check
      - name: Schema and migrations match
        run: |
          pnpm db:generate --name drift-check
          git diff --exit-code -- drizzle/ || { echo "Run pnpm db:generate and commit the migration."; exit 1; }
          test -z "$(git status --porcelain -- drizzle/)" || { git status -- drizzle/; exit 1; }
      - name: Migrations apply to an empty database
        run: pnpm db:migrate

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [rpcc, dnz]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cp .env.ci .env.local
      - run: pnpm build:${{ matrix.site }}
      - name: No server secrets in the client bundle
        run: node scripts/check-client-bundle.mjs
      - name: Initial JavaScript within budget
        run: pnpm size
