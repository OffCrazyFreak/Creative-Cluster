version: "3.8"

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: creative-cluster-backend:latest
    ports:
      - "8080:8080"
    environment:
      # Dokploy typically provides a managed database; provide the full JDBC URL and credentials
      # via environment variables or a dokploy-provided secret. Example in your .env:
      # POSTGRES_USER=postgres
      # POSTGRES_PASSWORD=bazepodataka
      # POSTGRES_DB=postgresql://postgres:bazepodataka@your-db-host:5432/your-db-name
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: creative-cluster-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
# Note: This compose file does not create a database service. Use Dokploy's managed DB or
# provide an external database and set SPRING_DATASOURCE_* env vars accordingly.
