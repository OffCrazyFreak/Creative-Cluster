# Reviews run through the CodeRabbit CLI per pull request. Automatic reviews on every push
# use the same hourly quota and starve those runs, so they are off.
reviews:
  auto_review:
    enabled: false
  # Generated and vendored files only make requests bigger; large requests fail to start on the free tier.
  path_filters:
    - "!pnpm-lock.yaml"
    - "!drizzle/meta/**"
    - "!src/components/ui/**"
    - "!public/**"
