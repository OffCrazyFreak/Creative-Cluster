# Automatic reviews are off because they use the same hourly quota as CodeRabbit CLI runs.
reviews:
  review_status: false
  auto_review:
    enabled: false
  # Generated and vendored files only make requests bigger; large requests fail to start on the free tier.
  path_filters:
    - "!pnpm-lock.yaml"
    - "!drizzle/meta/**"
    - "!src/components/ui/**"
    - "!public/**"
